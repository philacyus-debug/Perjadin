<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Kegiatan Perjadin - BPS</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            body {
                background: white;
                -webkit-print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .print-container {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
            }
        }
        table.report-table {
            border-collapse: collapse;
            width: 100%;
            font-family: Arial, sans-serif;
            font-size: 11pt;
            color: black;
        }
        table.report-table th, table.report-table td {
            border: 1px solid black;
            padding: 6px 10px;
            vertical-align: top;
        }
    </style>
</head>
<body class="bg-slate-100 text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxPpDXgKKPvaI1e0bQMi_yspTBjNJMS_3xTqqg5gzVCWpLPEA00iS1VkMxchd8M4CKh/exec";

            const [formData, setFormData] = useState({
                nama: "",
                tujuan: "",
                jadwal: "",
                anggaranMembiayai: "054",
                anggaranDiperiksa: "054",
                urutanKegiatan: "",
                pejabatTempat: ""
            });

            const [photos, setPhotos] = useState({ foto1: "", foto2: "", foto3: "" });
            const [loading, setLoading] = useState(false);

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleImageChange = (e, fotoKey) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setPhotos(prev => ({ ...prev, [fotoKey]: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);

                const payload = { ...formData, ...photos };

                try {
                    await fetch(WEB_APP_URL, {
                        method: "POST",
                        mode: "no-cors",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    alert("Data berhasil dicatat ke Google Spreadsheet!");
                } catch (error) {
                    alert("Gagal menyimpan data ke Spreadsheet.");
                } finally {
                    setLoading(false);
                }
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="max-w-4xl mx-auto my-6 p-6 bg-white shadow-xl rounded-lg print-container">
                    
                    {/* PANEL INPUT (Tersembunyi Saat Dicetak) */}
                    <div className="no-print mb-8 p-6 bg-slate-50 border rounded-lg shadow-sm">
                        <h2 className="text-lg font-bold mb-4 text-blue-800">Form Pengisian Laporan Perjadin</h2>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                            <div>
                                <label className="block font-semibold mb-1">Nama Petugas:</label>
                                <input type="text" name="nama" value={formData.nama} onChange={handleChange} required className="w-full p-2 border rounded bg-white" placeholder="Nama & Gelar" />
                            </div>
                            <div>
                                <label className="block font-semibold mb-1">Tujuan / Lokasi:</label>
                                <input type="text" name="tujuan" value={formData.tujuan} onChange={handleChange} required className="w-full p-2 border rounded bg-white" placeholder="Tujuan perjalanan" />
                            </div>
                            <div>
                                <label className="block font-semibold mb-1">Anggaran yang Membiayai:</label>
                                <input type="text" name="anggaranMembiayai" value={formData.anggaranMembiayai} onChange={handleChange} className="w-full p-2 border rounded bg-white" />
                            </div>
                            <div>
                                <label className="block font-semibold mb-1">Anggaran yang Diperiksa:</label>
                                <input type="text" name="anggaranDiperiksa" value={formData.anggaranDiperiksa} onChange={handleChange} className="w-full p-2 border rounded bg-white" />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block font-semibold mb-1">Jadwal Pelaksanaan:</label>
                                <input type="text" name="jadwal" value={formData.jadwal} onChange={handleChange} required className="w-full p-2 border rounded bg-white" placeholder="Contoh: 10 - 12 Oktober 2026" />
                            </div>
                            <div className="md:col-span-2">
                                <label className="block font-semibold mb-1">B. Urutan Kegiatan (Ringkasan Hasil):</label>
                                <textarea name="urutanKegiatan" rows="4" value={formData.urutanKegiatan} onChange={handleChange} required className="w-full p-2 border rounded bg-white" placeholder="Uraikan ringkasan hasil kegiatan..."></textarea>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block font-semibold mb-1">C. Pejabat dan Tempat yang Dikunjungi:</label>
                                <textarea name="pejabatTempat" rows="2" value={formData.pejabatTempat} onChange={handleChange} required className="w-full p-2 border rounded bg-white" placeholder="Daftar pejabat/tempat yang dikunjungi..."></textarea>
                            </div>
                            
                            <div className="md:col-span-2 border-t pt-4">
                                <label className="block font-semibold mb-2">D. Dokumentasi (Unggah Foto):</label>
                                <div className="grid grid-cols-3 gap-3">
                                    <div>
                                        <input type="file" accept="image/*" onChange={(e) => handleImageChange(e, 'foto1')} className="text-xs mb-1" />
                                        {photos.foto1 && <img src={photos.foto1} className="h-20 w-full object-cover border" />}
                                    </div>
                                    <div>
                                        <input type="file" accept="image/*" onChange={(e) => handleImageChange(e, 'foto2')} className="text-xs mb-1" />
                                        {photos.foto2 && <img src={photos.foto2} className="h-20 w-full object-cover border" />}
                                    </div>
                                    <div>
                                        <input type="file" accept="image/*" onChange={(e) => handleImageChange(e, 'foto3')} className="text-xs mb-1" />
                                        {photos.foto3 && <img src={photos.foto3} className="h-20 w-full object-cover border" />}
                                    </div>
                                </div>
                            </div>

                            <div className="md:col-span-2 flex gap-4 mt-2">
                                <button type="submit" disabled={loading} className="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded shadow">
                                    {loading ? "Menyimpan..." : "Simpan ke Spreadsheet"}
                                </button>
                                <button type="button" onClick={handlePrint} className="bg-slate-800 hover:bg-black text-white font-medium py-2 px-6 rounded shadow">
                                    Cetak Dokumen Sesuai Format Asli
                                </button>
                            </div>
                        </form>
                    </div>

                    {/* DOKUMEN CETAK UTAMA (Persis Susunan Dokumen Word Asli) */}
                    <div className="bg-white text-black p-2">
                        <div className="text-center font-bold text-xl mb-4 tracking-wide">
                            LAPORAN KEGIATAN
                        </div>

                        <table className="report-table">
                            <tbody>
                                {/* Baris Header UMUM */}
                                <tr>
                                    <td colSpan="2" className="font-bold bg-gray-50">UMUM</td>
                                    <td colSpan="2" className="font-bold bg-gray-50">4. Anggaran/Kegiatan yang membiayai</td>
                                </tr>
                                <tr>
                                    <td className="w-[15%] font-semibold">Nama</td>
                                    <td className="w-[35%]">{formData.nama || ""}</td>
                                    <td colSpan="2" rowSpan="3" className="w-[50%] align-top">{formData.anggaranMembiayai}</td>
                                </tr>
                                <tr>
                                    <td className="font-semibold">Tujuan</td>
                                    <td>{formData.tujuan || ""}</td>
                                </tr>
                                <tr>
                                    <td className="font-semibold">3. Jadwal</td>
                                    <td>{formData.jadwal || ""}</td>
                                </tr>
                                <tr>
                                    <td colSpan="2" className="bg-gray-50"></td>
                                    <td colSpan="2" className="font-bold bg-gray-50">5. Anggaran/Kegiatan yang diperiksa</td>
                                </tr>
                                <tr>
                                    <td colSpan="2" className="bg-gray-50"></td>
                                    <td colSpan="2" rowSpan="2" className="align-top">{formData.anggaranDiperiksa}</td>
                                </tr>
                                <tr>
                                    <td colSpan="2" className="bg-gray-50"></td>
                                </tr>
                                <tr>
                                    <td colSpan="2" className="bg-gray-50"></td>
                                    <td colSpan="2" className="font-bold bg-gray-50">6. Tanda tangan Petugas</td>
                                </tr>
                                <tr>
                                    <td colSpan="2" className="bg-gray-50"></td>
                                    <td colSpan="2" className="h-20 text-center text-gray-400 italic align-middle">
                                        (Dikosongkan sesuai permintaan)
                                    </td>
                                </tr>

                                {/* Bagian B */}
                                <tr>
                                    <td colSpan="4" className="font-bold bg-gray-50 pt-3">B. URUTAN KEGIATAN (RINGKASAN HASIL)</td>
                                </tr>
                                <tr>
                                    <td colSpan="4" className="min-h-[140px] whitespace-pre-line py-3">
                                        {formData.urutanKegiatan || ""}
                                    </td>
                                </tr>

                                {/* Bagian C */}
                                <tr>
                                    <td colSpan="4" className="font-bold bg-gray-50 pt-3">C. PEJABAT DAN TEMPAT YANG DIKUNJUNGI</td>
                                </tr>
                                <tr>
                                    <td colSpan="4" className="min-h-[90px] whitespace-pre-line py-3">
                                        {formData.pejabatTempat || ""}
                                    </td>
                                </tr>

                                {/* Bagian D */}
                                <tr>
                                    <td colSpan="4" className="font-bold bg-gray-50 pt-3">D. DOKUMENTASI</td>
                                </tr>
                                <tr>
                                    <td colSpan="4" className="py-3">
                                        <div className="grid grid-cols-3 gap-4">
                                            <div className="border border-dashed border-gray-400 p-2 text-center h-44 flex items-center justify-center bg-gray-50">
                                                {photos.foto1 ? <img src={photos.foto1} className="max-h-full max-w-full object-contain" /> : <span className="text-xs text-gray-400">Foto Dokumentasi 1</span>}
                                            </div>
                                            <div className="border border-dashed border-gray-400 p-2 text-center h-44 flex items-center justify-center bg-gray-50">
                                                {photos.foto2 ? <img src={photos.foto2} className="max-h-full max-w-full object-contain" /> : <span className="text-xs text-gray-400">Foto Dokumentasi 2</span>}
                                            </div>
                                            <div className="border border-dashed border-gray-400 p-2 text-center h-44 flex items-center justify-center bg-gray-50">
                                                {photos.foto3 ? <img src={photos.foto3} className="max-h-full max-w-full object-contain" /> : <span className="text-xs text-gray-400">Foto Dokumentasi 3</span>}
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
